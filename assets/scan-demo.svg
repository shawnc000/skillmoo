<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <!-- window -->
  <rect x="1" y="1" width="818" height="558" rx="14" fill="#1b1d1f" stroke="#33363a" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1.5" y="1.5" width="817" height="42" rx="14" fill="#232629"/>
  <rect x="1.5" y="28" width="817" height="16" fill="#232629"/>
  <circle cx="26" cy="22" r="6" fill="#ef4b5a"/>
  <circle cx="46" cy="22" r="6" fill="#e0982f"/>
  <circle cx="66" cy="22" r="6" fill="#16b981"/>
  <text x="410" y="27" text-anchor="middle" font-size="14" fill="#8b9096">skillmoo — scan</text>

  <g font-size="14">
    <text x="26" y="78"><tspan fill="#16b981" font-weight="700">$</tspan><tspan fill="#d7dade"> npx skillmoo scan</tspan></text>

    <text x="26" y="112"><tspan fill="#f4a159" font-weight="700">◇ SkillMOO scan</tspan><tspan fill="#8b9096"> · v0.3.10 · 100% local, read-only</tspan></text>

    <text x="26" y="146"><tspan fill="#8b9096">scan  Claude Code · user   ~/.claude/skills</tspan><tspan fill="#d7dade" font-weight="700">   5 skills</tspan></text>
    <text x="26" y="168" fill="#8b9096">──────────────────────────────────────────────────────────────</text>

    <text x="26" y="196"><tspan fill="#d7dade">safety     </tspan><tspan fill="#ef4b5a" font-weight="700">✕ 1 unsafe</tspan><tspan fill="#d7dade">   </tspan><tspan fill="#e0982f" font-weight="700">! 1 review</tspan><tspan fill="#d7dade">   </tspan><tspan fill="#16b981">✓ 3 ok</tspan></text>
    <text x="26" y="220"><tspan fill="#d7dade">bloat      </tspan><tspan fill="#16b981">✓ none bloated</tspan></text>
    <text x="26" y="244"><tspan fill="#d7dade">conflicts  </tspan><tspan fill="#e0982f">⚠ 1 pair</tspan></text>

    <text x="26" y="286"><tspan fill="#ef4b5a" font-weight="700">F</tspan><tspan fill="#ef4b5a">  ✕  </tspan><tspan fill="#d7dade" font-weight="700">aws-deployer </tspan><tspan fill="#8b9096">  credential read + network egress → likely exfiltration</tspan></text>
    <text x="26" y="312"><tspan fill="#16b981" font-weight="700">A</tspan><tspan fill="#e0982f">  !  </tspan><tspan fill="#d7dade" font-weight="700">weather      </tspan><tspan fill="#8b9096">  reads WEATHER_API_KEY + calls its API — </tspan><tspan fill="#e0982f">review, not blocked</tspan></text>
    <text x="26" y="338"><tspan fill="#16b981" font-weight="700">A</tspan><tspan fill="#16b981">  ✓  </tspan><tspan fill="#d7dade" font-weight="700">commit-writer</tspan><tspan fill="#8b9096">  clean</tspan></text>
    <text x="26" y="364"><tspan fill="#16b981" font-weight="700">A</tspan><tspan fill="#16b981">  ✓  </tspan><tspan fill="#d7dade" font-weight="700">pr-review    </tspan><tspan fill="#8b9096">  clean</tspan></text>
    <text x="26" y="390"><tspan fill="#16b981" font-weight="700">B</tspan><tspan fill="#16b981">  ✓  </tspan><tspan fill="#d7dade" font-weight="700">git-helper   </tspan><tspan fill="#8b9096">  clean · trigger too broad</tspan></text>

    <text x="26" y="430" fill="#8b9096">conflicts (worst first)</text>
    <text x="26" y="454"><tspan fill="#d7dade">  commit-writer </tspan><tspan fill="#8b9096">⇄</tspan><tspan fill="#d7dade"> git-helper </tspan><tspan fill="#8b9096">  both fire on: </tspan><tspan fill="#e0982f">commit, git</tspan></text>

    <text x="26" y="500" fill="#8b9096">─ capability ≠ intent: a skill that legitimately reads a key is <tspan fill="#e0982f">review</tspan>, never a false block.</text>
    <text x="26" y="528"><tspan fill="#f4a159">→</tspan><tspan fill="#8b9096"> full report + one-click optimize at </tspan><tspan fill="#f4a159">skillmoo.com</tspan></text>
  </g>
